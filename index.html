<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EKOLiTiKA – Winter Gift</title>

<style>
/* =========================================================
   DESIGN TOKENS – adjust overall look here
   ========================================================= */
:root {
  --night-1: #060b1c;
  --night-2: #0a1530;
  --night-3: #12214a;
  --moon-glow: rgba(220,230,255,0.18);

  --text-main: #f4f7ff;
  --text-soft: #cfd6ff;

  --forest-deep: #0b2a1f;
  --forest-mid: #143d2d;

  --ornament-light: #e9f6ff;
  --ornament-shadow: rgba(0,0,0,0.4);

  --modal-bg: rgba(10,15,35,0.9);
}

/* =========================================================
   BASE
   ========================================================= */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, var(--night-3), var(--night-1));
  color: var(--text-main);
  overflow: hidden; /* one screen only */
}

button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================================================
   LAYOUT WRAPPER – everything on one screen
   ========================================================= */
#app {
  position: relative;
  width: 100%;
  height: 100%;
}

/* =========================================================
   INTRO CARDS (CENTERED OVER EVERYTHING)
   ========================================================= */
#intro {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.story-card {
  width: min(520px, 90%);
  background: rgba(15, 25, 55, 0.85);
  backdrop-filter: blur(8px);
  border-radius: 20px;
  padding: 32px 28px 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.55);
  text-align: center;
  animation: cardIn 0.6s ease;
}

.story-card p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--text-soft);
}

.card-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 26px;
}

.card-nav button {
  background: transparent;
  border: 1px solid var(--text-soft);
  color: var(--text-main);
  padding: 8px 18px;
  border-radius: 999px;
  font-size: 0.9rem;
}

.card-nav button:disabled {
  opacity: 0.3;
  cursor: default;
}

.enter-btn {
  border-color: #8fd3b6;
  color: #eafff4;
}

/* =========================================================
   FOREST SCENE – hidden until intro ends
   ========================================================= */
#scene {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.2s ease;
}

/* reveal after intro */
#scene.visible {
  opacity: 1;
  pointer-events: auto;
}

/* =========================================================
   SKY & MOON
   ========================================================= */
.sky {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 70% 20%, var(--moon-glow), transparent 55%),
    linear-gradient(180deg, var(--night-3), var(--night-1));
}

.moon {
  position: absolute;
  top: 8%;
  right: 12%;
  width: 140px;
  height: 140px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffffff, #cfd8ff 60%);
  box-shadow: 0 0 60px rgba(220,230,255,0.35);
  opacity: 0.9;
}

/* =========================================================
   DISTANT FOREST (SILHOUETTES)
   ========================================================= */
.forest-back {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45%;
  background:
    linear-gradient(to top,
      rgba(5,15,25,0.95),
      rgba(5,15,25,0.6),
      transparent
    );
}

.forest-back::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      -60deg,
      rgba(10,40,30,0.9) 0 40px,
      rgba(10,40,30,0.7) 40px 80px
    );
  opacity: 0.25;
}

/* =========================================================
   LOGO
   ========================================================= */
.logo {
  position: absolute;
  top: 22px;
  width: 100%;
  text-align: center;
  z-index: 3;
}
.logo a {
  color: var(--text-main);
  text-decoration: none;
  letter-spacing: 1px;
  font-weight: 600;
}
/* Replace text with image when ready:
   <img src="YOUR_LOGO.png" alt="EKOLiTiKA logo">
*/

/* =========================================================
   TREE – more realistic via layered gradients
   ========================================================= */
.tree-container {
  position: absolute;
  left: 50%;
  bottom: 6%;
  transform: translateX(-50%);
  width: min(340px, 80vw);
  height: 70%;
  z-index: 2;
}

.tree {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
}

/* layered branches */
.branch {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  height: 28%;
  background: radial-gradient(
    ellipse at center,
    #2e7a5a,
    #184534 70%
  );
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
  filter: drop-shadow(0 10px 12px rgba(0,0,0,0.4));
}

.branch.b1 { top: 0; width: 90%; }
.branch.b2 { top: 18%; width: 80%; }
.branch.b3 { top: 36%; width: 70%; }
.branch.b4 { top: 54%; width: 60%; }

/* trunk */
.trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 34px;
  height: 60px;
  background: linear-gradient(#3a2a1a, #2a1d12);
  border-radius: 6px;
}

/* =========================================================
   ORNAMENTS – glass-like
   ========================================================= */
.ornament {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, #ffffff, #bfe8d5 55%, #6fae92 100%);
  box-shadow:
    inset -2px -4px 6px rgba(0,0,0,0.25),
    0 6px 12px var(--ornament-shadow);
  cursor: pointer;
}

.ornament::after {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  width: 2px;
  height: 6px;
  background: #ccc;
  transform: translateX(-50%);
}

.ornament:hover::before {
  content: attr(data-title);
  position: absolute;
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  white-space: nowrap;
}

/* =========================================================
   INTRO TEXT UNDER LOGO
   ========================================================= */
.scene-intro {
  position: absolute;
  top: 70px;
  width: 100%;
  text-align: center;
  font-size: 0.9rem;
  color: var(--text-soft);
  z-index: 3;
}

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 6;
  align-items: center;
  justify-content: center;
}

.modal {
  width: min(720px, 92%);
  max-height: 80%;
  overflow-y: auto;
  background: var(--modal-bg);
  border-radius: 20px;
  padding: 28px;
  position: relative;
}

.modal h2 {
  margin-top: 0;
}

.modal pre {
  white-space: pre-wrap;
  font-size: 0.85rem;
  color: var(--text-soft);
}

.close-btn {
  position: absolute;
  top: 14px;
  right: 18px;
  font-size: 1.2rem;
  cursor: pointer;
}

.copy-btn {
  margin-top: 16px;
  padding: 10px 18px;
  border-radius: 999px;
  border: none;
  background: #6fb89c;
  color: #052017;
}

.copy-status {
  margin-top: 8px;
  font-size: 0.75rem;
  height: 1em;
}

/* =========================================================
   SNOW
   ========================================================= */
.snowflake {
  position: absolute;
  top: -10px;
  color: white;
  opacity: 0.75;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 4;
}

@keyframes fall {
  to { transform: translateY(110vh); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>
<div id="app">

  <!-- INTRO -->
  <div id="intro">
    <div class="story-card">
      <p id="storyText"></p>
      <div class="card-nav">
        <button id="backBtn">Back</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>
  </div>

  <!-- FOREST SCENE -->
  <div id="scene">
    <div class="sky"></div>
    <div class="moon"></div>

    <div class="logo">
      <a href="https://ekolitika.framer.website" target="_blank">EKOLiTiKA</a>
    </div>

    <div class="scene-intro">
      Click an ornament to get a ready-to-copy AI prompt for your next growth season.
    </div>

    <div class="tree-container">
      <div class="tree" id="tree">
        <div class="branch b1"></div>
        <div class="branch b2"></div>
        <div class="branch b3"></div>
        <div class="branch b4"></div>
      </div>
      <div class="trunk"></div>
    </div>

    <div class="forest-back"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="close-btn" id="closeModal">×</div>
      <h2 id="modalTitle"></h2>
      <pre id="modalContent"></pre>
      <button class="copy-btn" id="copyBtn">Copy prompt</button>
      <div class="copy-status" id="copyStatus"></div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   INTRO STORY LOGIC
   ========================================================= */
const stories = [
  "This year, we chose regeneration over resolutions. Less pushing. More listening. More care for what’s already here.",
  "This space is our winter gift to you. Not a plan to follow, but a pause—to breathe, reflect, and reset in your own way.",
  "Nature reminds us that growth is quiet before it is visible. The ornaments are invitations, not instructions—small starting points for whatever season you’re in.",
  "Everything here is free, private, and pressure-free. When you’re ready, step into the forest and let one ornament lead the way."
];

let index = 0;
const storyText = document.getElementById("storyText");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");
const intro = document.getElementById("intro");
const scene = document.getElementById("scene");

function renderStory() {
  storyText.textContent = stories[index];
  backBtn.disabled = index === 0;
  nextBtn.textContent = index === stories.length - 1
    ? "Enter the winter forest"
    : "Next";
}
renderStory();

backBtn.onclick = () => {
  if (index > 0) index--;
  renderStory();
};

nextBtn.onclick = () => {
  if (index < stories.length - 1) {
    index++;
    renderStory();
  } else {
    intro.style.opacity = "0";
    setTimeout(() => {
      intro.style.display = "none";
      scene.classList.add("visible");
    }, 600);
  }
};

/* =========================================================
   ORNAMENT DATA & CREATION
   Change positions here for fine-tuning layout
   ========================================================= */
const ornaments = [
  { title: "Roots of Purpose", prompt: "..." },
  { title: "Flow & Balance", prompt: "..." },
  { title: "Collaboration Seeds", prompt: "..." },
  { title: "Story Harvest", prompt: "..." },
  { title: "Digital Garden", prompt: "..." },
  { title: "Shared Light", prompt: "..." },
  { title: "Care & Renewal", prompt: "..." },
  { title: "Creative Flow", prompt: "..." },
  { title: "Project Clarity", prompt: "..." },
  { title: "Harvest & Learning", prompt: "..." },
  { title: "Brave Experiments", prompt: "..." },
  { title: "Gratitude Canopy", prompt: "..." }
];

const tree = document.getElementById("tree");

ornaments.forEach((o, i) => {
  const el = document.createElement("div");
  el.className = "ornament";
  el.dataset.title = o.title;

  /* Positioning relative to tree */
  el.style.top = (80 + i * 24) + "px";
  el.style.left = (120 + (i % 3) * 40) + "px";

  el.onclick = () => openModal(o.title, o.prompt);
  tree.appendChild(el);
});

/* =========================================================
   MODAL
   ========================================================= */
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");
const copyBtn = document.getElementById("copyBtn");
const copyStatus = document.getElementById("copyStatus");

document.getElementById("closeModal").onclick = closeModal;
modalOverlay.onclick = e => { if (e.target === modalOverlay) closeModal(); };

function openModal(title, content) {
  modalTitle.textContent = title;
  modalContent.textContent = content;
  modalOverlay.style.display = "flex";
}

function closeModal() {
  modalOverlay.style.display = "none";
  copyStatus.textContent = "";
}

copyBtn.onclick = () => {
  navigator.clipboard.writeText(modalContent.textContent).then(() => {
    copyStatus.textContent = "Copied!";
    setTimeout(() => copyStatus.textContent = "", 1500);
  });
};

/* =========================================================
   SNOW
   ========================================================= */
const snowCount = window.innerWidth < 600 ? 25 : 50;
for (let i = 0; i < snowCount; i++) {
  const s = document.createElement("div");
  s.className = "snowflake";
  s.textContent = "❄";
  s.style.left = Math.random() * 100 + "vw";
  s.style.fontSize = 8 + Math.random() * 12 + "px";
  s.style.animationDuration = 6 + Math.random() * 8 + "s";
  document.body.appendChild(s);
}
</script>
</body>
</html>
