<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EKOLiTiKA – Winter Gift</title>

<style>
/* =========================
   DO NOT CHANGE: BASE SYSTEM
   ========================= */
:root{
  --glass:rgba(6,10,28,0.82);
  --text-main:#f4f7ff;
  --text-soft:#cfd6ff;
  --accent-green:#6fb89c;
  --accent-gold:#f5c77a;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text-main);
  background:#020617;
}

/* =========================
   REALISTIC FOREST BACKGROUND
   (image-inspired, cinematic)
   ========================= */
.forest-bg{
  position:fixed;
  inset:0;
  background:
    linear-gradient(to top, rgba(2,6,23,.9), rgba(2,6,23,.55)),
     linear-gradient(135deg, #1a472a 0%, #2d6a4f 50%, #40916c 100%);
  background-size:cover;
  background-position:center;
  z-index:1;
}

.mist{
  position:fixed;
  bottom:-10%;
  left:0;
  width:100%;
  height:45%;
  background:
    radial-gradient(ellipse at center,
      rgba(255,255,255,.18),
      rgba(255,255,255,.08),
      transparent 70%);
  filter:blur(10px);
  z-index:2;
  pointer-events:none;
}

#snow{
  position:fixed;
  inset:0;
  z-index:3;
  pointer-events:none;
}

/* =========================
   INTRO CARDS (unchanged)
   ========================= */
#intro{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
    transition:opacity .7s ease;
}
.story-card{
  width:min(520px,90%);
  background:var(--glass);
  backdrop-filter:blur(12px);
  border-radius:22px;
  padding:34px 30px 26px;
  box-shadow:0 30px 90px rgba(0,0,0,.65);
  text-align:center;
  animation:fadeUp .7s ease;
}
.story-card p{
  font-size:1.05rem;
  line-height:1.6;
  color:var(--text-soft);
}
.card-nav{
  display:flex;
  justify-content:space-between;
  margin-top:26px;
}
.card-nav button{
  border-radius:999px;
  padding:10px 22px;
  border:1px solid var(--text-soft);
  background:transparent;
  color:var(--text-main);
}
.card-nav button.primary{
  border-color:var(--accent-green);
}
.card-nav button:disabled{opacity:.3}

/* =========================
   MAIN SCENE (unchanged)
   ========================= */
#scene{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease;
  z-index:5;
}
#scene.visible{
  opacity:1;
  pointer-events:auto;
}

.header{
  position:absolute;
  top:22px;
  width:100%;
  text-align:center;
  z-index:6;
}
.header a{
  color:var(--text-main);
  text-decoration:none;
  letter-spacing:2px;
  font-weight:500;
}
.header p{
  margin-top:6px;
  font-size:.85rem;
  color:var(--text-soft);
}

/* ======================================================
   ✨ REALISTIC TREE (PHOTO-BASED, NOT DRAWN)
   ====================================================== */
.tree-wrap{
  position:absolute;
  left:50%;
  bottom:6%;
  transform:translateX(-50%);
  width:min(460px,85vw);
  height:78%;
  z-index:6;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

/* TREE IMAGE */
.tree-photo{
  position:absolute;
  bottom:0;
  width:100%;
  height:100%;
  background:
     linear-gradient(to right, transparent calc(50% - 30px), #0d3b2f 0, #0d3b2f calc(100% - 0px), transparent 100%), linear-gradient(135deg, #1a472a 0%, #2d6a4f 50%, #40916c 100%);
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center bottom;
  filter:
    drop-shadow(0 40px 70px rgba(0,0,0,.85))
    brightness(1.05)
    contrast(1.05);
}

/* ======================================================
   ORNAMENTS – realistic warm lights
   ====================================================== */
.ornament{
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  cursor:pointer;
  background:
    radial-gradient(circle at 30% 30%,
      #fff,
      #ffdca8 55%,
      #c79a3d 100%);
  box-shadow:
    0 0 12px rgba(255,220,160,.9),
    0 0 22px rgba(255,220,160,.5);
  transition:transform .35s ease, box-shadow .35s ease;
}
.ornament:hover{
  transform:scale(1.8);
  box-shadow:
    0 0 20px rgba(255,230,180,1),
    0 0 40px rgba(255,230,180,.8);
  z-index:20;
}

.ornament::after{
  content:attr(data-title);
  position:absolute;
  top:-34px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  padding:5px 10px;
  border-radius:8px;
  font-size:.7rem;
  white-space:nowrap;
  opacity:0;
  transition:.2s;
}
.ornament:hover::after{opacity:1}

/* =========================
   MODAL (unchanged)
   ========================= */
.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
  z-index:50;
}
.modal-box{
  width:min(720px,92%);
  max-height:82%;
  overflow:auto;
  background:var(--glass);
  border-radius:24px;
  padding:32px;
  box-shadow:0 40px 120px rgba(0,0,0,.7);
  position:relative;
}
.modal pre{
  white-space:pre-wrap;
  font-size:.85rem;
  color:var(--text-soft);
  background:rgba(0,0,0,.35);
  padding:18px;
  border-radius:14px;
  border-left:4px solid var(--accent-green);
}
.close{
  position:absolute;
  top:16px;
  right:20px;
  font-size:1.2rem;
  cursor:pointer;
}
.copy-btn{
  margin-top:16px;
  border-radius:999px;
  padding:12px 26px;
  border:none;
  background:var(--accent-green);
  color:#052017;
  font-weight:600;
}
.copy-status{
  margin-top:8px;
  font-size:.75rem;
  color:var(--accent-green);
  height:1em;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<div class="forest-bg"></div>
<div class="mist"></div>
<canvas id="snow"></canvas>

<!-- INTRO -->
<div id="intro">
  <div class="story-card">
    <p id="storyText"></p>
    <div class="card-nav">
      <button id="backBtn">Back</button>
      <button id="nextBtn" class="primary">Next</button>
    </div>
  </div>
</div>

<!-- SCENE -->
<div id="scene">
  <div class="header">
    <a href="https://ekolitika.framer.website" target="_blank">EKOLiTiKA</a>
    <p>Click an ornament to receive a ready-to-copy AI prompt</p>
  </div>

  <div class="tree-wrap">
    <div class="tree-photo" id="tree">
      <!-- Ornament positions tuned for realistic tree silhouette -->
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="close" onclick="closeModal()">×</div>
    <h2 id="mTitle"></h2>
    <pre id="mText"></pre>
    <button class="copy-btn" onclick="copyPrompt()">Copy prompt</button>
    <div class="copy-status" id="copyStatus"></div>
  </div>
</div>

<script>
/* =========================
   INTRO LOGIC (unchanged)
   ========================= */
const stories=[
"This year, we chose regeneration over resolutions. Less pushing. More listening. More care for what’s already here.",
"This space is our winter gift to you. Not a plan to follow, but a pause, to breathe, reflect, and reset in your own way.",
"Nature reminds us that growth is quiet before it is visible. The ornaments are invitations, not instructions, but small starting points for whatever season you’re in.",
"Everything here is free, private, and pressure-free. When you’re ready, step into the forest and let one ornament lead the way."
];
let s=0;
const storyText=document.getElementById("storyText");
const backBtn=document.getElementById("backBtn");
const nextBtn=document.getElementById("nextBtn");
function renderStory(){
  storyText.textContent=stories[s];
  backBtn.disabled=s===0;
  nextBtn.textContent=s===stories.length-1?"Enter the winter forest":"Next";
}
renderStory();
backBtn.onclick=()=>{if(s>0){s--;renderStory();}};
nextBtn.onclick=()=>{
  if(s<stories.length-1){s++;renderStory();}
  else{
    document.getElementById("intro").style.opacity="0";
    setTimeout(()=>{
      document.getElementById("intro").style.display="none";
      document.getElementById("scene").classList.add("visible");
    },700);
  }
};

/* =========================
   PROMPTS (unchanged placeholders)
   ========================= */
const PROMPTS = [
{
  title: "Roots of Purpose",
  text: `Like roots growing unseen beneath winter soil, purpose becomes clear when you slow down enough to listen.

You are a strategic guide using nature-based thinking to help clarify direction, values, and long-term intent. This prompt comes from a reflective planning tool created by EKOLiTiKA, designed to support regeneration over pressure.

Context for you to work with:
• Organization or initiative name: [NAME_OF_ORGANISATION_OR_PROJECT]
• My role or perspective: [MY_ROLE_OR_POSITION]
• Who this purpose serves: [PEOPLE_OR_COMMUNITY_AT_THE_CENTER]
• Current uncertainty or drift: [WHAT_FEELS_UNCLEAR_RIGHT_NOW]
• Purpose we want to strengthen: [CORE_INTENTION_OR_GOAL]
• Time horizon to consider: [TIMEFRAME_OR_SEASON]

Your outputs must include:

1. A strategic narrative (1–2 paragraphs) clarifying values, non-negotiables, and deeper purpose using grounded nature metaphors.
2. A detailed, Excel/Sheets-ready table:

Step | Strategic focus | Owner / Steward | Deadline | Check-in rhythm | Success metrics`
},

{
  title: "Flow & Balance",
  text: `Think of work as a river: it moves best when it follows its natural rhythm, not when it is forced.

You are a strategic wellbeing and capacity planner, helping design sustainable flow between effort, rest, and attention. This tool is part of a regeneration-focused planning space created by EKOLiTiKA.

Context to consider:
• Initiative or team: [TEAM_OR_PROJECT_NAME]
• My role in the system: [MY_ROLE]
• Current energy pattern: [ENERGY_STATE_NOW]
• Areas where balance is missing: [WHERE_FLOW_BREAKS]
• Desired rhythm or outcome: [BALANCE_GOAL]
• Timeframe: [TIMEFRAME]

Please produce:
1. A strategic narrative restoring flow using river and seasonal metaphors.
2. A table-structured action plan:

Step | Adjustment or boundary | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Collaboration Seeds",
  text: `Some collaborations grow like seeds exchanged between forests—small at first, resilient over time.

You are a partnership strategist using ecological thinking to design collaborations rooted in reciprocity and trust.

Context:
• Organization or collective: [ORGANISATION_NAME]
• My role: [MY_ROLE]
• Existing or potential partners: [PARTNER_TYPES_OR_NAMES]
• Current collaboration challenge: [WHAT_IS_MISSING_OR_FRAGILE]
• Desired collaboration outcome: [COLLABORATION_GOAL]
• Timeframe: [TIMEFRAME]

Outputs required:
1. A strategic narrative on planting and protecting collaboration seeds.
2. An Excel-ready table:

Step | Partnership action | Who is involved | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Story Harvest",
  text: `Before winter, forests gather what matters. Stories need the same care.

You are a learning and narrative strategist helping teams harvest insights before they are lost.

Context:
• Project or organization: [PROJECT_NAME]
• My role: [MY_ROLE]
• Where stories live: [STORY_SOURCES]
• What is currently undocumented: [WHAT_GETS_LOST]
• Purpose of harvesting stories: [WHY_THIS_MATTERS_NOW]
• Timeframe: [TIMEFRAME]

Please provide:
1. A strategic narrative on memory, learning, and continuity.
2. A structured table:

Step | Story focus | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Digital Garden",
  text: `Digital spaces thrive when treated like gardens, not machines.

You are a digital strategy gardener focused on sustainable platforms.

Context:
• Digital presence name: [PLATFORM_OR_BRAND]
• My role: [MY_ROLE]
• Main digital spaces: [CHANNELS_OR_PLATFORMS]
• Current digital overload or neglect: [WHAT_FEELS_UNHEALTHY]
• Desired digital outcome: [DIGITAL_GOAL]
• Timeframe: [TIMEFRAME]

Deliver:
1. A strategic narrative on cultivating digital spaces.
2. A Sheets-ready table:

Step | Digital action | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Shared Light",
  text: `Light travels best when it is shared, not hoarded.

You are a visibility and amplification strategist focused on ethical sharing.

Context:
• Initiative: [INITIATIVE_NAME]
• My role: [MY_ROLE]
• Who deserves more light: [PEOPLE_OR_WORK_TO_AMPLIFY]
• Current visibility gap: [WHAT_IS_UNSEEN]
• Desired impact: [VISIBILITY_GOAL]
• Timeframe: [TIMEFRAME]

Outputs:
1. A strategic narrative about shared visibility.
2. A structured plan table:

Step | Sharing action | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Care & Renewal",
  text: `Nothing regenerates without rest—not forests, not people.

You are a care-centered strategy planner embedding renewal into systems.

Context:
• Team or community: [TEAM_NAME]
• My role: [MY_ROLE]
• Main stressors present: [PRESSURES_OR_RISKS]
• What feels depleted: [WHERE_CARE_IS_NEEDED]

• Timeframe: [TIMEFRAME]

Please create:

2. An Excel-ready table:

},

  title: "Creative Flow",
  text: `Creativity returns when it feels safe to play.

Context:

Produce:

2. A structured table:

},

{
  title: "Project Clarity",
  text: `Clear paths reduce fear and wasted energy.

You are a project clarity strategist structuring work without rigidity.

Context:
• Project name: [PROJECT_NAME]
• My role: [MY_ROLE]
• Current confusion or risk: [WHAT_FEELS_MESSY]

Deliver:
1. A strategic narrative on calm progress.
2. An Excel-ready table:

Step | Structural decision | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Harvest & Learning",
  text: `Learning happens when the season is consciously closed.

You are a learning and reflection strategist supporting integration.

Context:
• Activities or phase reviewed: [ACTIVITIES]
• My role: [MY_ROLE]
• What hasn’t been reflected on: [MISSING_LEARNING]
• Desired learning outcome: [LEARNING_GOAL]
• Timeframe: [TIMEFRAME]

Please produce:
1. A strategic narrative on transforming experience into insight.
2. A table-structured plan:

Step | Reflection focus | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Brave Experiments",
  text: `Small experiments leave footprints that teach without harm.

You are an experimentation strategist focused on safe-to-fail learning.

Context:
• Area to test: [EXPERIMENT_AREA]
• My role: [MY_ROLE]
• Fear or hesitation present: [WHAT_FEELS_RISKY]
• Learning question: [WHAT_WE_WANT_TO_LEARN]
• Timeframe: [TIMEFRAME]

Create:
1. A strategic narrative framing experimentation as learning.
2. An Excel-ready table:

Step | Experiment | Owner | Deadline | Check-in | Metrics`
},

{
  title: "Gratitude Canopy",
  text: `Gratitude creates shelter where trust can grow.

You are a culture and trust strategist embedding appreciation into systems.

Context:
• Community or team: [TEAM_NAME]
• My role: [MY_ROLE]
• Where appreciation is missing: [GAPS_IN_RECOGNITION]
• Desired cultural shift: [GRATITUDE_GOAL]
• Timeframe: [TIMEFRAME]

Please deliver:
1. A strategic narrative on gratitude and resilience.
2. A structured planning table:

Step | Gratitude practice | Owner | Deadline | Check-in | Metrics`

];
;

/* =========================
   ORNAMENTS – REALISTIC PLACEMENT
   ========================= */
const tree=document.getElementById("tree");
const positions=[
[18,50],[26,42],[30,58],[38,45],[42,60],[48,36],
[52,54],[58,40],[62,62],[68,46],[72,56],[76,44]
];
prompts.forEach((t,i)=>{
  const o=document.createElement("div");
  o.className="ornament";
  o.style.top=positions[i][0]+"%";
  o.style.left=positions[i][1]+"%";
  o.dataset.title==PROMPTS[i].title;
o.onclick = () => {
  openModal(PROMPTS[i]);
};
  tree.appendChild(o);
});

/* =========================
   MODAL
   ========================= */
function openModal(data){
  document.getElementById("mTitle").textContent = data.title;
  document.getElementById("mText").textContent = data.text;
  document.getElementById("modal").style.display = "flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
  document.getElementById("copyStatus").textContent="";
}
function copyPrompt(){
  navigator.clipboard.writeText(document.getElementById("mText").textContent)
  .then(()=>{
    const cs=document.getElementById("copyStatus");
    cs.textContent="Copied!";
    setTimeout(()=>cs.textContent="",1500);
  });
}

/* =========================
   SNOW (unchanged)
   ========================= */
const canvas=document.getElementById("snow");
const ctx=canvas.getContext("2d");
let flakes=[];
function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
class Flake{
  constructor(){
    this.x=Math.random()*canvas.width;
    this.y=Math.random()*canvas.height;
    this.r=Math.random()*2+1;
    this.v=Math.random()*1+.4;
    this.h=Math.random()*.5-.25;
  }
  move(){
    this.y+=this.v;this.x+=this.h;
    if(this.y>canvas.height){this.y=-10;this.x=Math.random()*canvas.width;}
  }
  draw(){
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  }
}
function initSnow(){
  resize();
  flakes=Array.from({length:120},()=>new Flake());
  loop();
}
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  flakes.forEach(f=>{f.move();f.draw();});
  requestAnimationFrame(loop);
}
addEventListener("resize",resize);
initSnow();
</script>

</body>
</html>
