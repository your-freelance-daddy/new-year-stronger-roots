<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EKOLiTiKA – Winter Gift</title>

<style>
/* =========================================================
   COLOR VARIABLES – adjust palette here
   ========================================================= */
:root {
  --bg-deep: #070d1f;
  --bg-mid: #0b1633;
  --bg-light: #14224a;
  --text-main: #f3f6ff;
  --text-soft: #cfd6ff;
  --green-accent: #2f6b4f;
  --green-soft: #3f8a67;
  --overlay-dark: rgba(5, 10, 25, 0.75);
}

/* =========================================================
   BASE RESET
   ========================================================= */
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
  color: var(--text-main);
  scroll-behavior: smooth;
}
button {
  font-family: inherit;
  cursor: pointer;
}

/* =========================================================
   INTRO CARD SECTION
   ========================================================= */
#intro {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 20px;
}

.story-card {
  max-width: 520px;
  background: rgba(15, 25, 55, 0.85);
  backdrop-filter: blur(6px);
  border-radius: 18px;
  padding: 32px 28px 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  text-align: center;
  animation: fadeLift 0.6s ease;
}

.story-card p {
  font-size: 1.05rem;
  line-height: 1.6;
  color: var(--text-soft);
}

.card-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 24px;
}

.card-nav button {
  background: transparent;
  border: 1px solid var(--text-soft);
  color: var(--text-main);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.9rem;
}

.card-nav button:disabled {
  opacity: 0.3;
  cursor: default;
}

.card-nav .enter-btn {
  border-color: var(--green-soft);
  color: #eafff4;
}

/* =========================================================
   FOREST SECTION
   ========================================================= */
#forest {
  min-height: 140vh;
  position: relative;
  background: linear-gradient(180deg, var(--bg-mid), var(--bg-light));
  overflow: hidden;
  padding-top: 80px;
}

/* moonlight */
.moon {
  position: absolute;
  top: 60px;
  right: 10%;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle, rgba(255,255,255,0.18), rgba(255,255,255,0) 70%);
  pointer-events: none;
}

/* distant trees */
.forest-back {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 45%;
  background: linear-gradient(
    to top,
    rgba(10,20,40,0.9),
    rgba(10,20,40,0.3),
    transparent
  );
}

/* =========================================================
   LOGO AREA
   ========================================================= */
.logo {
  position: relative;
  text-align: center;
  margin-bottom: 20px;
  z-index: 2;
}
.logo a {
  color: var(--text-main);
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 1px;
  font-size: 1.1rem;
}
/* Replace text below with <img src="logo.png"> when ready */
/* <img src="PATH_TO_LOGO" alt="EKOLiTiKA logo"> */

/* =========================================================
   TREE
   ========================================================= */
.tree-container {
  position: relative;
  width: 320px;
  max-width: 90vw;
  margin: 40px auto 0;
  z-index: 2;
}

.tree {
  position: relative;
  width: 100%;
  height: 480px;
}

.tree::before,
.tree::after {
  content: "";
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(to bottom, #245b43, #1b3f31);
  border-radius: 50%;
}

.tree::before {
  top: 0;
  width: 100%;
  height: 60%;
}
.tree::after {
  top: 25%;
  width: 80%;
  height: 65%;
}

/* trunk */
.trunk {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 60px;
  background: #3b2a1a;
  border-radius: 8px;
}

/* =========================================================
   ORNAMENTS
   Change positions via top/left below
   ========================================================= */
.ornament {
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ffffff, #9fd6c0);
  box-shadow: 0 0 12px rgba(160, 220, 200, 0.8);
  cursor: pointer;
}
.ornament:hover::after {
  content: attr(data-title);
  position: absolute;
  top: -28px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  white-space: nowrap;
}

/* =========================================================
   FOREST TEXT
   ========================================================= */
.forest-intro {
  text-align: center;
  max-width: 680px;
  margin: 0 auto 20px;
  font-size: 0.95rem;
  color: var(--text-soft);
  z-index: 2;
  position: relative;
}

.credits {
  text-align: center;
  margin-top: 40px;
  font-size: 0.75rem;
  color: var(--text-soft);
}
.credits a {
  color: var(--text-main);
  text-decoration: underline;
}

/* =========================================================
   SNOW
   ========================================================= */
.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  opacity: 0.8;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 3;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
  }
}

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 5;
  align-items: center;
  justify-content: center;
}

.modal {
  background: rgba(15,25,55,0.95);
  border-radius: 18px;
  max-width: 720px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px;
  position: relative;
}

.modal h2 {
  margin-top: 0;
}

.modal pre {
  white-space: pre-wrap;
  font-size: 0.85rem;
  color: var(--text-soft);
}

.close-btn {
  position: absolute;
  top: 14px;
  right: 18px;
  font-size: 1.2rem;
  cursor: pointer;
}

.copy-btn {
  margin-top: 16px;
  padding: 10px 18px;
  border-radius: 999px;
  border: none;
  background: var(--green-soft);
  color: #eafff4;
}

.copy-status {
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text-soft);
  height: 1em;
}

/* =========================================================
   ANIMATIONS
   ========================================================= */
@keyframes fadeLift {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<section id="intro">
  <div class="story-card" id="storyCard">
    <p id="storyText"></p>
    <div class="card-nav">
      <button id="backBtn">Back</button>
      <button id="nextBtn">Next</button>
    </div>
  </div>
</section>

<section id="forest">
  <div class="moon"></div>

  <div class="logo">
    <a href="https://ekolitika.framer.website" target="_blank">EKOLiTiKA</a>
  </div>

  <div class="forest-intro">
    Click an ornament to get a ready-to-copy AI prompt for your next growth season.
  </div>

  <div class="tree-container">
    <div class="tree" id="tree">
      <!-- Ornaments (positions adjustable here) -->
    </div>
    <div class="trunk"></div>
  </div>

  <div class="credits">
    A tool designed by <a href="https://ekolitika.framer.website" target="_blank">EKOLiTiKA</a> for everyone who chooses REGENRATION over New Year’s resolutions.
  </div>

  <div class="forest-back"></div>
</section>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="close-btn" id="closeModal">×</div>
    <h2 id="modalTitle"></h2>
    <pre id="modalContent"></pre>
    <button class="copy-btn" id="copyBtn">Copy prompt</button>
    <div class="copy-status" id="copyStatus"></div>
  </div>
</div>

<script>
/* =========================================================
   INTRO CARDS LOGIC
   ========================================================= */
const stories = [
"This year, we chose regeneration over resolutions. Less pushing. More listening. More care for what’s already here.",
"This space is our winter gift to you. Not a plan to follow, but a pause—to breathe, reflect, and reset in your own way.",
"Nature reminds us that growth is quiet before it is visible. The ornaments are invitations, not instructions—small starting points for whatever season you’re in.",
"Everything here is free, private, and pressure-free. When you’re ready, step into the forest and let one ornament lead the way."
];

let currentStory = 0;
const storyText = document.getElementById("storyText");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

function renderStory() {
  storyText.textContent = stories[currentStory];
  backBtn.disabled = currentStory === 0;
  if (currentStory === stories.length - 1) {
    nextBtn.textContent = "Enter the winter forest";
  } else {
    nextBtn.textContent = "Next";
  }
}

backBtn.onclick = () => {
  if (currentStory > 0) currentStory--;
  renderStory();
};

nextBtn.onclick = () => {
  if (currentStory < stories.length - 1) {
    currentStory++;
    renderStory();
  } else {
    document.getElementById("forest").scrollIntoView({behavior: "smooth"});
  }
};

renderStory();

/* =========================================================
   ORNAMENT DATA – change prompt text here if needed
   ========================================================= */
const ornamentsData = [
  { title: "Roots of Purpose", prompt: `Like roots growing unseen beneath winter soil, purpose becomes clear when you slow down enough to listen.
You are a strategic guide using nature-based thinking to help clarify direction, values, and long-term intent. This prompt comes from a reflective planning tool created by EKOLiTiKA, designed to support regeneration over pressure.

My role or perspective: [MY_ROLE_OR_POSITION]

Who this purpose serves: [PEOPLE_OR_COMMUNITY_AT_THE_CENTER]

Current uncertainty or drift: [WHAT_FEELS_UNCLEAR_RIGHT_NOW]

Purpose we want to strengthen: [CORE_INTENTION_OR_GOAL]

Time horizon to consider: [TIMEFRAME_OR_SEASON]
Your outputs must include:
A strategic narrative (1–2 paragraphs) that clarifies our “roots”: values, non-negotiables, and the deeper reason this work exists, using grounded nature metaphors and clear strategic language.
A detailed, Excel/Sheets-ready table that translates purpose into action, using columns such as:
Step | Strategic focus | Owner / Steward | Deadline | Check-in rhythm | Success metrics`},
  /* Remaining prompts are included verbatim below */
];

const remainingPrompts = [
["Flow & Balance", `Think of work as a river: it moves best when it follows its natural rhythm, not when it is forced.
You are a strategic wellbeing and capacity planner, helping design sustainable flow between effort, rest, and attention. This tool is part of a regeneration-focused planning space created by EKOLiTiKA.
Context to consider:

Initiative or team: [TEAM_OR_PROJECT_NAME]

My role in the system: [MY_ROLE]

Current energy pattern (overload, stagnation, chaos): [ENERGY_STATE_NOW]

Areas where balance is missing: [WHERE_FLOW_BREAKS]

Desired rhythm or outcome: [BALANCE_GOAL]

Timeframe: [TIMEFRAME]
Please produce:
A strategic narrative describing how to restore flow, reduce friction, and protect energy over time, using river and seasonal metaphors.
A table-structured action plan with columns such as:
Step | Adjustment or boundary | Owner | Deadline | Check-in | Metrics (energy, clarity, pace)`],
["Collaboration Seeds", `Some collaborations grow like seeds exchanged between forests—small at first, resilient over time.
You are a partnership strategist using ecological thinking to design collaborations rooted in reciprocity and trust. This prompt is part of a partner-gift platform developed by EKOLiTiKA.
Context:

Organization or collective: [ORGANISATION_NAME]

My role: [MY_ROLE]

Existing or potential partners: [PARTNER_TYPES_OR_NAMES]

Current collaboration challenge: [WHAT_IS_MISSING_OR_FRAGILE]

Desired collaboration outcome: [COLLABORATION_GOAL]

Timeframe: [TIMEFRAME]
Outputs required:
A strategic narrative outlining how to plant, nurture, and protect collaboration seeds.
An Excel-ready table with columns such as:
Step | Partnership action | Who is involved | Owner | Deadline | Check-in | Metrics (trust, reciprocity, output)`],
["Story Harvest", `Before winter, forests gather what matters. Stories need the same care.
You are a learning and narrative strategist, helping teams harvest insights before they are lost. This reflective tool was created by EKOLiTiKA to support gentle knowledge retention.
Context:

Project or organization: [PROJECT_NAME]

My role: [MY_ROLE]

Where stories live (projects, people, moments): [STORY_SOURCES]

What is currently undocumented: [WHAT_GETS_LOST]

Purpose of harvesting stories: [WHY_THIS_MATTERS_NOW]

Timeframe: [TIMEFRAME]
Please provide:
A strategic narrative explaining how story harvesting strengthens memory, learning, and continuity.
A structured table with columns such as:
Step | Story focus | Owner | Deadline | Check-in | Metrics (captured, reused, shared)`],
["Digital Garden", `Digital spaces thrive when treated like gardens, not machines.
You are a digital strategy gardener, focused on tending platforms sustainably. This prompt comes from a nature-inspired planning space by EKOLiTiKA.
Context:

Digital presence name: [PLATFORM_OR_BRAND]

My role: [MY_ROLE]

Main digital spaces: [CHANNELS_OR_PLATFORMS]

Current digital overload or neglect: [WHAT_FEELS_UNHEALTHY]

Desired digital outcome: [DIGITAL_GOAL]

Timeframe: [TIMEFRAME]
Deliver:
A strategic narrative describing how to cultivate, prune, and nourish digital spaces.
A Sheets-ready table with columns such as:
Step | Digital action | Owner | Deadline | Check-in | Metrics (reach, resonance, sustainability)`],
["Shared Light", `Light travels best when it is shared, not hoarded.
You are a visibility and amplification strategist, focused on ethical sharing. This reflective prompt is part of a gift-based planning platform by EKOLiTiKA.
Context:

Outputs:
A strategic narrative about sharing light in ways that build trust and collective strength.
A structured plan table with columns such as:
Step | Sharing action | Owner | Deadline | Check-in | Metrics (reach, trust, reciprocity)`],
["Care & Renewal", `Nothing regenerates without rest—not forests, not people.
You are a care-centered strategy planner, helping embed renewal into systems. This prompt is part of EKOLiTiKA’s regeneration-first toolkit.
Context:

Team or community: [TEAM_NAME]

My role: [MY_ROLE]

Main stressors present: [PRESSURES_OR_RISKS]

What feels depleted: [WHERE_CARE_IS_NEEDED]

Renewal goal: [CARE_OUTCOME]

Timeframe: [TIMEFRAME]
Please create:
A strategic narrative framing care as a foundation for long-term impact.
An Excel-ready table with columns such as:

["Creative Flow", `Creativity returns when it feels safe to play.
You are a creative process strategist, designing low-pressure systems for experimentation. This prompt comes from a creative planning space developed by EKOLiTiKA.
Context:

Creative project: [PROJECT_NAME]

Produce:

["Project Clarity", `Clear paths reduce fear and wasted energy.
You are a project clarity strategist, helping structure work without rigidity. This prompt is part of EKOLiTiKA’s gentle planning tools.
Context:

Project name: [PROJECT_NAME]

My role: [MY_ROLE]

Current confusion or risk: [WHAT_FEELS_MESSY]

What clarity would unlock: [CLARITY_GOAL]

Timeframe: [TIMEFRAME]
Deliver:

A structured planning table with columns such as:
Step | Structural decision | Owner | Deadline | Check-in | Metrics (clarity, progress, risk reduction)`],
["Harvest & Learning", `Learning happens when the season is consciously closed.
You are a learning and reflection strategist, supporting closure and integration. This prompt comes from EKOLiTiKA’s reflection-oriented platform.
Context:

Activities or phase reviewed: [ACTIVITIES]

My role: [MY_ROLE]

What hasn’t been reflected on: [MISSING_LEARNING]

Desired learning outcome: [LEARNING_GOAL]

Timeframe: [TIMEFRAME]
Please produce:
A strategic narrative on transforming experience into insight.
A table-structured plan with columns such as:
Step | Reflection focus | Owner | Deadline | Check-in | Metrics (learning captured, applied)`],
["Brave Experiments", `Small experiments leave footprints that teach without harm.
You are an experimentation strategist, focused on safe-to-fail learning. This prompt is part of EKOLiTiKA’s regenerative planning tools.
Context:

Area to test: [EXPERIMENT_AREA]

My role: [MY_ROLE]

Fear or hesitation present: [WHAT_FEELS_RISKY]

Learning question: [WHAT_WE_WANT_TO_LEARN]

Timeframe: [TIMEFRAME]
Create:
A strategic narrative framing experimentation as learning, not success or failure.
An Excel-ready table with columns such as:
Step | Experiment | Owner | Deadline | Check-in | Metrics (learning, signal, next decision)`],
["Gratitude Canopy", `Gratitude creates shelter where trust can grow.
You are a culture and trust strategist, helping embed appreciation into systems. This prompt is part of a values-based toolkit created by EKOLiTiKA.
Context:

Community or team: [TEAM_NAME]

My role: [MY_ROLE]

Where appreciation is missing: [GAPS_IN_RECOGNITION]

Desired cultural shift: [GRATITUDE_GOAL]

Timeframe: [TIMEFRAME]
Please deliver:
A strategic narrative describing how gratitude strengthens resilience and collaboration.
A structured planning table with columns such as:
Step | Gratitude practice | Owner | Deadline | Check-in | Metrics (trust, morale, continuity)`]
];

remainingPrompts.forEach(p => ornamentsData.push({title: p[0], prompt: p[1]}));

/* =========================================================
   CREATE ORNAMENTS
   ========================================================= */
const tree = document.getElementById("tree");
ornamentsData.forEach((o, i) => {
  const el = document.createElement("div");
  el.className = "ornament";
  el.dataset.title = o.title;
  el.style.top = (40 + i * 30) + "px";
  el.style.left = (60 + (i % 3) * 80) + "px";
  el.onclick = () => openModal(o.title, o.prompt);
  tree.appendChild(el);
});

/* =========================================================
   MODAL LOGIC
   ========================================================= */
const modalOverlay = document.getElementById("modalOverlay");
const modalTitle = document.getElementById("modalTitle");
const modalContent = document.getElementById("modalContent");
const copyBtn = document.getElementById("copyBtn");
const copyStatus = document.getElementById("copyStatus");
document.getElementById("closeModal").onclick = closeModal;

function openModal(title, content) {
  modalTitle.textContent = title;
  modalContent.textContent = content;
  modalOverlay.style.display = "flex";
}

function closeModal() {
  modalOverlay.style.display = "none";
  copyStatus.textContent = "";
}

modalOverlay.onclick = e => {
  if (e.target === modalOverlay) closeModal();
};

copyBtn.onclick = () => {
  navigator.clipboard.writeText(modalContent.textContent).then(() => {
    copyStatus.textContent = "Copied!";
    setTimeout(() => copyStatus.textContent = "", 1500);
  });
};

/* =========================================================
   SNOWFALL
   ========================================================= */
const snowCount = window.innerWidth < 600 ? 30 : 60;
for (let i = 0; i < snowCount; i++) {
  const snow = document.createElement("div");
  snow.className = "snowflake";
  snow.textContent = "❄";
  snow.style.left = Math.random() * 100 + "vw";
  snow.style.animationDuration = 5 + Math.random() * 10 + "s";
  snow.style.fontSize = 8 + Math.random() * 12 + "px";
  document.body.appendChild(snow);
}
</script>

</body>
</html>
